# CAT (categorical trading) — faithful defaults.
#
# Every value is either stated in the source material or is the author's
# declared personal preference; see src/ict_backtest/strategy/cat.py for
# the claim-by-claim mapping. Timeframe never appears here by design:
# all distances are multiples of the trailing average candle range, which
# is the approach's central "works on any timeframe" claim.

[strategy]
# categorization
regime_window = 24          # trailing bars scored for consolidation vs direction
er_direction = 0.40         # efficiency ratio >= this -> direction
er_consolidation = 0.15     # efficiency ratio <= this -> consolidation
stability_bars = 4          # category must hold this many closed bars

# bracket sizing ("adjust the target and stop to the size of the candles")
candle_size_window = 10
bracket_frac = 0.5          # target ~ half the recent average candle range
rr = 1.0                    # 1:1 risk-reward, his recommended starting point

# entry filters
consolidation_mode = "follow" # "fade" = short the top band / long the bottom band
avoid_extremes_frac = 0.25  # no longs in the top / shorts in the bottom quarter
require_new_area = true     # direction targets must reach beyond the range
require_stop_outside = false # true = textbook box drawing; false = his live play
outlier_mult = 2.5
outlier_skip_bars = 2

# category toggles ("you don't need to adapt and trade everything";
# the author himself ran consolidation-only for a period)
trade_consolidation = true
trade_direction = true

# outlier context: "always" = his flat rule; "direction_exempt" = the
# journey guide's contextual refinement; "off"
outlier_block_mode = "always"

# volatility band — the timeframe-switching trick mechanized for a fixed
# timeframe (0 window = off)
vol_ref_window = 0
vol_band_low = 0.0
vol_band_high = 0.0

# day-extreme veto: skip entries within N avg-candles of the running ET-day
# high/low ("I don't take trades at the high or low of day"; 0 = off)
avoid_day_extreme_atr = 0.0

# execution ("carefully placed limit orders rather than market orders")
entry_order = "market"
limit_offset_frac = 0.0
limit_expiry_bars = 3

# risk
risk_pct = 1.0
max_leverage = 5.0
exit_on_flip = false
breakeven_r = 0.0          # his final system moves nothing; 0 = off

# session discipline (values are personal/data-derived; 0 = off)
max_daily_loss_r = 0.0
max_trades_per_day = 0

# session (personal preference; his own is "09:33-09:50" ET)
session_et = ""
